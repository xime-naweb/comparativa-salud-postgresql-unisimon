services:
  postgres_db:
    image: postgis/postgis:16-3.4
    container_name: postgres_salud_lab
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: AdminPassword123
      POSTGRES_DB: bd_salud_publica
    ports:
      - "5432:5432"
    volumes:
      - pg_data_salud:/var/lib/postgresql/data

  mysql_db:
    image: mysql:8.4
    container_name: mysql_salud_lab
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: bd_salud_publica
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  pg_data_salud:
  mysql_data: